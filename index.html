<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2433">
<title>Latin vocab test, Wed 18 Nov</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--mut:#6b7280;--acc:#4f6bed;--ok:#1f9d6b;--bad:#d9534f;--warn:#d98a1f;--line:#e4e1d9;--chip:#ecebe6}
.dark{--bg:#141821;--card:#1f2533;--ink:#eef0f5;--mut:#9aa3b5;--acc:#8ea2ff;--ok:#3fcf94;--bad:#ff7b76;--warn:#f0b35a;--line:#2e3647;--chip:#2a3142}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.4}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.12rem;margin:6px 0}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:1.1rem;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs button,.chips button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;font-weight:600;cursor:pointer;padding:6px 8px}
.tabs button{flex:1 1 calc(33% - 8px)}
.chips button{flex:0 0 auto;min-height:40px;font-size:.92rem;font-weight:500;background:var(--chip)}
.tabs button.on,.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:260px;margin:14px 0;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.06);cursor:pointer;user-select:none;position:relative}
.card .lab{position:absolute;top:12px;left:16px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.card .sec{position:absolute;top:12px;right:16px;font-size:.78rem;color:var(--mut)}
.card .star{position:absolute;bottom:10px;right:14px;color:var(--warn);font-size:1.1rem}
.big{font-size:1.75rem;font-weight:650;line-height:1.25;word-break:break-word}
.sub{color:var(--mut);margin-top:12px;font-size:1rem}
.hint{color:var(--mut);font-size:.85rem;text-align:center}
.btns{display:flex;gap:10px}
.btns button,.main{flex:1;min-height:58px;border:none;border-radius:16px;font-size:1.08rem;font-weight:700;cursor:pointer;color:#fff}
.b-bad{background:var(--warn)}.b-ok{background:var(--ok)}.main{background:var(--acc);width:100%}
.b-sec{background:var(--chip)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
input[type=text]{width:100%;font-size:1.35rem;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--acc)}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.acc button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:1.1rem;cursor:pointer}
.fb{margin:10px 0;padding:12px 14px;border-radius:14px;font-size:1.05rem;display:none}
.fb.ok{display:block;background:rgba(31,157,107,.14);color:var(--ok)}
.fb.bad{display:block;background:rgba(217,83,79,.13);color:var(--bad)}
.fb.near{display:block;background:rgba(217,138,31,.14);color:var(--warn)}
.fb b{color:var(--ink)}
.opts{display:grid;gap:10px}
.opts button{min-height:58px;text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem;cursor:pointer}
.opts button.right{border-color:var(--ok);background:rgba(31,157,107,.14)}
.opts button.wrong{border-color:var(--bad);background:rgba(217,83,79,.13)}
.done{text-align:center;padding:24px 10px}
.done .tick{font-size:4rem;color:var(--ok)}
.small{font-size:.85rem;color:var(--mut)}
.link{background:none;border:none;color:var(--acc);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:6px}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Latin vocab test, Wed 18 Nov</h1>
    <div style="display:flex;gap:6px">
      <button class="icon" id="dirBtn" title="Swap direction">EN→LA</button>
      <button class="icon" id="themeBtn" title="Dark / light">◐</button>
    </div>
  </header>

    <button data-m="parts">Parts</button>
    <button data-m="endings">Endings</button>

  <div class="row chips" id="decks"></div>

  <div class="stats"><span id="sScore">Score 0</span><span id="sStreak">Streak 0</span><span id="sLeft">0 left</span></div>

  <div id="stage"></div>
  <div style="text-align:center;margin-top:6px">
    <button class="link" id="restart">↻ Shuffle &amp; restart</button>
    <button class="link" id="clearHard">Clear ★ Hard ones</button>
  </div>
  <p class="small" style="text-align:center"><span id="total"></span> words. Progress saves on this device.</p>
</div>
<div id="confetti"></div>
<div class="toast" id="toast"></div>

function verbMeanings(f){
  const w = WORD(f.vid);
  return (w.meanings||[w.en]).filter(m => ENVERB[m]);
}
function endingPrimary(f){
  const ms = verbMeanings(f);
  const first = ENVERB[ms[0]];
  const p = PERSON_LAB[f.person];
  let main;
  if (f.tense==="pres"){
    const v = f.person==="3sg" ? first.pres3 : first.inf;
    main = `${p} ${v}`;
  } else if (f.tense==="impf"){
    const be = f.person==="1sg"||f.person==="3sg" ? "was" : "were";
    main = `${p} ${be} ${first.ing} / used to ${first.inf}`;
  } else {
    main = `${p} ${first.past} / have ${first.pp}`.replace("he/she have","he/she has");
    if (f.person==="3sg") main = `${p} ${first.past} / has ${first.pp}`;
  }
  if (ms.length>1){
    const extra = ms.slice(1).map(m => {
      const e = ENVERB[m];
      if (f.tense==="pres") return f.person==="3sg" ? e.pres3 : e.inf;
      if (f.tense==="impf") return e.ing;
      return e.past;
    });
    main = main + " / " + extra.join(" / ");
  }
  return main;
}
function endingVariants(f){
  const out = new Set();
  const prons = PRONS[f.person].slice();
  if (f.person==="3sg") prons.push("they"); // singular they
  for (const meaning of verbMeanings(f)){
    const e = ENVERB[meaning];
    for (const p of prons){
      const isThey3sg = f.person==="3sg" && p==="they";
      if (f.tense==="pres"){
        const v = (f.person==="3sg" && !isThey3sg) ? e.pres3 : e.inf;
        out.add(`${p} ${v}`);
        const bes = isThey3sg ? ["are"] : BE_PRES[f.person];
        for (const b of bes) out.add(`${p} ${b} ${e.ing}`);
      } else if (f.tense==="impf"){
        const bes = isThey3sg ? ["were"] : BE_PAST[f.person];
        for (const b of bes) out.add(`${p} ${b} ${e.ing}`);
        out.add(`${p} used to ${e.inf}`);
        out.add(`${p} would ${e.inf}`);
      } else {
        out.add(`${p} ${e.past}`);
        const hs = isThey3sg ? ["have"] : HAVE[f.person];
        for (const h of hs) out.add(`${p} ${h} ${e.pp}`);
        out.add(`${p} did ${e.inf}`);
      }
    }
  }
  return [...out];
}

/* ---- normalisation and checking ---- */
function norm(s){
  return String(s).toLowerCase()
    .replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’‘`´]/g,"'")
    .replace(/\b(i|you|we|they|he|she|it)'m\b/g,"$1 am")
    .replace(/\b(i|you|we|they)'ve\b/g,"$1 have")
    .replace(/\b(he|she|it)'s\b/g,"$1 is")
    .replace(/\b(i|you|we|they|he|she|it)'d\b/g,"$1 would")
    .replace(/\b(you|we|they|he|she|it)'re\b/g,"$1 are")
    .replace(/\bdon't\b/g,"do not").replace(/\bdidn't\b/g,"did not")
    .replace(/'/g," ")
    .replace(/[?!¡¿.,;:…"«»()\-]/g," ")
    .replace(/\s+/g," ").trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ let c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n];
}
function bestLev(g, vs){
  return Math.min(...vs.map(v => lev(g, v)));
}
function closeEnough(g, vs){
  const d = bestLev(g, vs);
  const tol = Math.max(1, Math.floor(Math.min(...vs.map(v=>v.length))/8));
  return d<=tol;
}
function vocabLatinVariants(w){
  const v = new Set();
  const add = s => { const n=norm(s); if(n) v.add(n); };
  add(w.la); add(w.lemma);
  if (w.parts) w.parts.forEach(add);
  add(w.lemma.replace(/\?$/,""));
  add(w.la.replace(/\?$/,""));
  return [...v];
}
function vocabEnglishVariants(w){
  const v = new Set();
  const add = s => { const n=norm(s); if(n) v.add(n); };
  add(w.en);
  (w.meanings||[]).forEach(add);
  // allow "plan, idea" written as "plan and idea" etc already split
  return [...v];
}
function checkVocab(input, w){
  const g = norm(input); if (!g) return "bad";
  const toLa = st.dir==="en";
  const vs = (toLa ? vocabLatinVariants(w) : vocabEnglishVariants(w));
  if (vs.includes(g)) return "ok";
  // typo tolerance on spaceless forms
  const gs=g.replace(/ /g,""), vss=vs.map(x=>x.replace(/ /g,""));
  if (vss.includes(gs)) return "ok";
  return closeEnough(gs, vss) ? "near" : "bad";
}
function checkParts(input, w){
  const g = norm(input); if (!g) return "bad";
  const toLa = st.dir==="en";
  if (!toLa) return checkVocab(input, w);
  const expected = w.parts.map(norm);
  const bits = g.split(/[,\s]+/).filter(Boolean);
  const joined = expected.join(" ");
  if (g===joined) return "ok";
  if (bits.length>=3 && expected.every((p,i)=>bits[i]===p)) return "ok";
  // contracted eō perfect 2sg/2pl accepted in display of parts? parts are lemma list, not endings
  const gs=g.replace(/ /g,""), exp=joined.replace(/ /g,"");
  if (gs===exp) return "ok";
  return closeEnough(gs, [exp]) ? "near" : "bad";
}
function checkEnding(input, f){
  const g = norm(input); if (!g) return "bad";
  const toLa = st.dir==="en";
  if (toLa){
    const vs = [norm(f.la)];
    // accept contracted perfect of pereō: peristi / persistis for periisti / periistis
    if (f.vid==="w17" && f.tense==="perf" && f.person==="2sg") vs.push(norm("perīstī"));
    if (f.vid==="w17" && f.tense==="perf" && f.person==="2pl") vs.push(norm("perīstis"));
    if (vs.includes(g) || vs.map(x=>x.replace(/ /g,"")).includes(g.replace(/ /g,""))) return "ok";
    return closeEnough(g.replace(/ /g,""), vs.map(x=>x.replace(/ /g,""))) ? "near" : "bad";
  }
  const vs = endingVariants(f).map(norm);
  if (vs.includes(g)) return "ok";
  if (vs.map(x=>x.replace(/ /g,"")).includes(g.replace(/ /g,""))) return "ok";
  // A perfect match for a different tense or person of the same verb is wrong, not a typo.
  const others = FORMS.filter(x => x.vid===f.vid && x.id!==f.id);
  for (const o of others){
    const ovs = endingVariants(o).map(norm);
    if (ovs.includes(g) || ovs.map(x=>x.replace(/ /g,"")).includes(g.replace(/ /g,""))) return "bad";
  }
  return closeEnough(g, vs) ? "near" : "bad";
}
function checkInput(input, item){
  if (isEndings()) return checkEnding(input, item);
  if (isParts()) return checkParts(input, item);
  return checkVocab(input, item);
}

    if (isEndings()) n = k==="All" ? FORMS.length : k==="Hard" ? FORMS.filter(f=>hard.has(f.id)).length : FORMS.filter(f=>f.tense===k).length;
    else if (isParts()) n = k==="Hard" ? VERBS.filter(w=>hard.has("p-"+w.id)).length : VERBS.length;
    else n = k==="All" ? WORDS.length : k==="Hard" ? WORDS.filter(w=>hard.has(w.id)).length : WORDS.filter(w=>w.s===k).length;
    const b = document.createElement("button");
    b.textContent = `${label} (${n})`; b.className = st.deck===k ? "on" : "";
    b.onclick = () => { st.deck=k; save("deck",k); buildChips(); restart(); };
    box.appendChild(b);
  });
}

function restart(){
  queue = shuffle(deckItems()); startCount = queue.length;
  score = 0; streak = 0; seen = 0;
  next();
}
function updStats(){
  const left = queue.length + (cur ? 1 : 0);
  $("sScore").textContent = `Score ${score}/${seen}`;
  $("sStreak").textContent = `Streak ${streak}${best>1?" · best "+best:""}`;
  $("sLeft").textContent = `${left} left`;
  const done = startCount ? (startCount - left)/startCount : 0;
  $("prog").style.width = Math.max(0,Math.min(100,done*100)) + "%";
}
function markHard(item, isHard){
  const id = itemId(item);
  if (isHard) hard.add(id); else hard.delete(id);
  save("hard", [...hard]); buildChips();
}
function record(ok){
  seen++;
  if (ok){ score++; streak++; best=Math.max(best,streak); } else streak = 0;
}

function next(){
  cur = queue.shift() || null; flipped = false; answered = false;
  updStats();
  if (!cur) return finish();
  renderCurrent();
}
function renderCurrent(){
  const practice = currentPractice();
  ({cards:renderCard, type:renderType, quiz:renderQuiz})[practice]();
}
function currentPractice(){
  if (st.mode==="cards"||st.mode==="type"||st.mode==="quiz") return st.mode;
  return st.practice || "type";
}

function cardHead(item){
  let sec = "";
  if (isEndings()) sec = TENSE_LAB[item.tense];
  else if (isParts()) sec = "principal parts";
  else sec = item.s==="verb" ? "verb" : "";
  return `${sec?`<span class="sec">${esc(sec)}</span>`:""}${hard.has(itemId(item))?'<span class="star">★</span>':''}`;
}
function practiceBar(){
  if (!isParts() && !isEndings()) return "";
  const p = currentPractice();
  return `<div class="row chips" style="margin-top:0" id="practice">
    <button data-p="cards" class="${p==="cards"?"on":""}">Flashcards</button>
    <button data-p="type" class="${p==="type"?"on":""}">Type it</button>
    <button data-p="quiz" class="${p==="quiz"?"on":""}">Quiz</button>
  </div>`;
}
function bindPractice(){
  const box = $("practice"); if (!box) return;
  box.querySelectorAll("button").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    st.practice = b.dataset.p; save("practice", st.practice);
    restart();
  });
}

function labText(flipped){
  if (isEndings()){
    if (st.dir==="en") return flipped ? "Latin" : "English → Latin form";
    return flipped ? "English" : "Latin form";
  }
  if (isParts()){
    return flipped
      ? (st.dir==="en"?"Latin principal parts":"English")
      : (st.dir==="en"?"English → principal parts":"Latin");
  }
  return flipped ? (st.dir==="en"?"Latin":"English") : (st.dir==="en"?"English":"Latin");
}

/* ---- Flashcards ---- */
function renderCard(){
  const w = cur;
  const hint = isEndings() && w.hint && !flipped ? `<div class="sub">${TENSE_LAB[w.tense]} tense</div>` : "";
  const extra = flipped && isEndings() ? `<div class="sub">${esc(w.lemma)} · ${esc(w.en)}</div>` : "";
  $("stage").innerHTML = `
   ${practiceBar()}
   <div class="card" id="fc">${cardHead(w)}
     <span class="lab">${labText(flipped)}</span>
     <div class="big">${esc(flipped ? answerShown(w) : promptOf(w))}</div>
     ${flipped ? `<div class="sub">${esc(promptOf(w))}</div>${extra}` : `${hint}<div class="sub">Say it out loud, then tap to check</div>`}
   </div>
   ${flipped ? `<div class="btns"><button class="b-bad" id="no">← Still learning</button><button class="b-ok" id="yes">I knew it →</button></div>`
             : `<button class="main" id="flip">Show answer</button>`}
   <p class="hint">Tap card or Space to flip · ← still learning · → knew it</p>`;
  bindPractice();
  $("fc").onclick = flip;
  if (flipped){ $("no").onclick = ev => { ev.stopPropagation(); grade(false); }; $("yes").onclick = ev => { ev.stopPropagation(); grade(true); }; }
  else $("flip").onclick = ev => { ev.stopPropagation(); flip(); };
}
function flip(){ if (currentPractice()!=="cards"||!cur) return; flipped = !flipped; renderCard(); }
function grade(ok){
  if (!cur || currentPractice()!=="cards") return;
  if (!flipped){ flipped = true; renderCard(); return; }
  record(ok);
  if (ok){ if (st.deck==="Hard") markHard(cur,false); }
  else { markHard(cur,true); queue.splice(Math.min(queue.length, 4+Math.floor(Math.random()*4)), 0, cur); startCount++; }
  next();
}

/* ---- Type it ---- */
const ACC = ["ā","ē","ī","ō","ū"];
function typeHint(){
  if (isEndings() && st.dir!=="en") return "Macrons don't matter. Enter to check, Enter again for next. Example: we raised";
  if (isEndings()) return "Macrons don't matter. Enter to check, Enter again for next.";
  if (isParts() && st.dir==="en") return "Type all three parts, commas optional. Macrons don't matter.";
  if (st.dir==="en") return "Macrons and capitals don't matter. For verbs, the first part is enough (e.g. aedifico).";
  return "Capitals don't matter. Any one meaning on the list is enough.";
}
function typePlaceholder(){
  if (isEndings()) return st.dir==="en" ? "Type the Latin form…" : "Type the English… e.g. we raised";
  if (isParts()) return st.dir==="en" ? "e.g. aedifico, aedificare, aedificavi" : "Type the English…";
  return st.dir==="en" ? "Type in Latin…" : "Type in English…";
}
function needsAccents(){
  return st.dir==="en"; // typing Latin
}
function renderType(){
  const w = cur;
  const hint = isEndings() && w.hint && st.dir!=="en" ? `<div class="sub">${TENSE_LAB[w.tense]} tense</div>` : "";
  $("stage").innerHTML = `
   ${practiceBar()}
   <div class="card" style="cursor:default;min-height:170px">${cardHead(w)}
     <span class="lab">${labText(false)}</span>
     <div class="big">${esc(promptOf(w))}</div>
     ${hint}
   </div>
   <input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(typePlaceholder())}">
   ${needsAccents()?`<div class="acc">${ACC.map(a=>`<button data-a="${a}">${a}</button>`).join("")}</div>`:""}
   <div class="fb" id="fb"></div>
   <div class="btns" id="tbtns"><button class="b-sec" id="skip">Show me</button><button class="b-ok" id="go">Check</button></div>
   <p class="hint">${esc(typeHint())}</p>`;
  bindPractice();
  const inp = $("ans"); setTimeout(()=>inp.focus(), 50);
  document.querySelectorAll(".acc button").forEach(b => b.onclick = () => {
    const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s;
    inp.value = inp.value.slice(0,s)+b.dataset.a+inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1,s+1);
  });
  inp.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); answered ? next() : submitType(); } });
  $("go").onclick = () => answered ? next() : submitType();
  $("skip").onclick = () => submitType(true);
}
function submitType(giveUp){
  if (answered) return; answered = true;
  const w = cur, inp = $("ans"), fb = $("fb");
  const r = giveUp ? "bad" : checkInput(inp.value, w);
  inp.blur();
  const shown = answerShown(w);
  if (r==="ok"){ fb.className="fb ok"; fb.innerHTML = `✓ Correct! <b>${esc(shown)}</b>`; record(true); if (st.deck==="Hard") markHard(w,false); }
  else if (r==="near"){ fb.className="fb near"; fb.innerHTML = `Nearly! Check the spelling: <b>${esc(shown)}</b><br><span class="small">Counted as right, and added to ★ Hard ones.</span>`; record(true); markHard(w,true); }
  else { fb.className="fb bad"; fb.innerHTML = `${giveUp?"":"✗ Not quite. "}Answer: <b>${esc(shown)}</b>${inp.value.trim()?`<br><span class="small">You wrote: ${esc(inp.value)}</span>`:""}
     <br><button class="link" id="override">I was right, count it</button>`; record(false); markHard(w,true);
     queue.splice(Math.min(queue.length,5), 0, w); startCount++;
     $("override").onclick = () => { score++; streak = 1; const i=queue.indexOf(w); if(i>=0){ queue.splice(i,1); startCount--; } markHard(w,false); toast("Counted ✓"); next(); };
  }
  $("tbtns").innerHTML = `<button class="main" id="nx">Next →</button>`;
  $("nx").onclick = next; $("nx").focus();
  updStats();
}

/* ---- Quiz ---- */
function quizPool(){
  if (isEndings()) return FORMS;
  if (isParts()) return VERBS;
  return WORDS;
}
function renderQuiz(){
  const w = cur, ans = answerShown(w);
  const pool = quizPool().filter(x => itemId(x)!==itemId(w) && answerShown(x)!==ans);
  let same;
  if (isEndings()) same = shuffle(pool.filter(x => x.vid===w.vid || x.tense===w.tense || x.person===w.person));
  else if (isParts()) same = shuffle(pool);
  else same = shuffle(pool.filter(x => x.s===w.s));
  const picks = [];
  for (const x of same){ if (picks.length>=3) break; if (!picks.includes(x)) picks.push(x); }
  while (picks.length<3 && pool.length){ const x = pool[Math.floor(Math.random()*pool.length)]; if (x && !picks.includes(x) && answerShown(x)!==ans) picks.push(x); }
  const opts = shuffle([w, ...picks.slice(0,3)]);
  const hint = isEndings() && w.hint && st.dir!=="en" ? `<div class="sub">${TENSE_LAB[w.tense]} tense</div>` : "";
  $("stage").innerHTML = `
   ${practiceBar()}
   <div class="card" style="cursor:default;min-height:170px">${cardHead(w)}
     <span class="lab">${st.dir==="en"? (isEndings()?"Pick the Latin form": isParts()?"Pick the principal parts":"Pick the Latin") : "Pick the English"}</span>
     <div class="big">${esc(promptOf(w))}</div>
     ${hint}
   </div>
   <div class="opts">${opts.map((o,i)=>`<button data-id="${itemId(o)}"><span class="small">${i+1}</span>&nbsp; ${esc(answerShown(o))}</button>`).join("")}</div>
   <div class="fb" id="fb"></div>
   <p class="hint">Tap an answer or press 1–4 · Enter for next</p>`;
  bindPractice();
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => pickQuiz(b));
}
function pickQuiz(b){
  if (answered){ next(); return; }
  answered = true;
  const w = cur, ok = b.dataset.id===itemId(w);
  document.querySelectorAll(".opts button").forEach(x => { if (x.dataset.id===itemId(w)) x.classList.add("right"); });
  if (!ok){ b.classList.add("wrong"); markHard(w,true); queue.splice(Math.min(queue.length,5),0,w); startCount++; }
  else if (st.deck==="Hard") markHard(w,false);
  record(ok);
  const fb=$("fb"); fb.className = ok?"fb ok":"fb bad";
  fb.innerHTML = ok ? "✓ Yes!" : `✗ It's <b>${esc(answerShown(w))}</b>`;
  updStats();
  setTimeout(()=>{ if (answered && cur===w) next(); }, ok ? 800 : 2200);
}

/* ---- Finish ---- */
function finish(){
  updStats();
  if (!startCount){
    $("stage").innerHTML = `${practiceBar()}<div class="card" style="cursor:default"><div class="big">No ★ Hard ones yet</div><div class="sub">Cards you mark "Still learning" or get wrong land here. Pick another deck to start.</div></div>`;
    bindPractice();
    return;
  }
  const pct = seen ? Math.round(score/seen*100) : 0;
  $("stage").innerHTML = `${practiceBar()}<div class="card done" style="cursor:default">
    <div class="tick">✓</div><div class="big">Deck done!</div>
    <div class="sub">${score}/${seen} right (${pct}%) · best streak ${best}</div>
    <div class="sub">★ Hard ones now: ${currentHardCount()}</div></div>
    <div class="btns">${currentHardCount()?`<button class="b-bad" id="goHard">Practise ★ Hard ones</button>`:""}<button class="b-ok" id="again">Go again</button></div>`;
  bindPractice();
  $("again").onclick = restart;
  if ($("goHard")) $("goHard").onclick = () => { st.deck="Hard"; save("deck","Hard"); buildChips(); restart(); };
  confetti();
}
function currentHardCount(){
  if (isEndings()) return FORMS.filter(f=>hard.has(f.id)).length;
  if (isParts()) return VERBS.filter(w=>hard.has("p-"+w.id)).length;
  return WORDS.filter(w=>hard.has(w.id)).length;
}
function confetti(){
  const box=$("confetti"), cols=["#4f6bed","#1f9d6b","#d98a1f","#e0559b","#5bc0de"];
  for(let i=0;i<60;i++){ const e=document.createElement("i"); e.style.left=Math.random()*100+"vw"; e.style.background=cols[i%5]; e.style.animationDelay=Math.random()*.6+"s"; e.style.transform=`rotate(${Math.random()*360}deg)`; box.appendChild(e); }
  setTimeout(()=>box.innerHTML="",3200);
}

/* ---- keyboard ---- */
document.addEventListener("keydown", e => {
  if (e.target.tagName==="INPUT") return;
  if (currentPractice()==="cards"){
    if (e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); flip(); }
    else if (e.key==="ArrowLeft") grade(false);
    else if (e.key==="ArrowRight") grade(true);
  } else if (currentPractice()==="quiz"){
    if (/^[1-4]$/.test(e.key)){ const b=document.querySelectorAll(".opts button")[+e.key-1]; if (b) pickQuiz(b); }
    else if (e.key==="Enter" && answered) next();
  } else if (currentPractice()==="type" && e.key==="Enter" && answered){ next(); }
});

$("themeBtn").onclick = () => { st.dark=!st.dark; save("dark",st.dark); applyTheme(); };
$("dirBtn").onclick = () => { st.dir = st.dir==="en"?"la":"en"; save("dir",st.dir); applyDir(); restart(); };
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("restart").onclick = restart;
$("clearHard").onclick = () => { if (confirm("Clear all ★ Hard ones?")){ hard.clear(); save("hard",[]); buildChips(); if (st.deck==="Hard") restart(); } };
$("total").textContent = WORDS.length;

st.practice = load("practice", "type");
{ const h=location.hash.slice(1); if (["cards","type","quiz","parts","endings"].includes(h)) st.mode=h; if (h==="dark") st.dark=true; }
if (!["cards","type","quiz","parts","endings"].includes(st.mode)) st.mode="cards";
applyTheme(); applyDir();
document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on", b.dataset.m===st.mode));
const allowed = currentSecs().map(x=>x[0]);
if (!allowed.includes(st.deck)) st.deck="All";
buildChips();
restart();
</script>
</body>
